# ─────────────────────────────────────────────────────
#   project · Stacks
#   module  · keepalive.yml — keep scheduled workflows of this public repo running
#   author  · Jiří "8B1T" Lhotský
# ─────────────────────────────────────────────────────
# GitHub disables scheduled workflows in a public repository after 60 days
# without activity (docs, "Events that trigger workflows"); the uptime
# monitor would stop silently. A dated commit every 10 days is that activity,
# and since this workflow is scheduled too, it keeps itself alive as well.
# NOTE · "[skip ci]" keeps the commit from starting web-test.yml for nothing.

name: Keepalive

on:
  schedule:
    - cron: "23 4 */10 * *" # 1st, 11th, 21st (and 31st), off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Dated commit
        run: |
          printf '# Stacks keepalive, written by .github/workflows/keepalive.yml\n%s\n' \
            "$(TZ=Europe/Prague date '+%Y-%m-%d %H:%M %Z')" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive for scheduled workflows [skip ci]"
          git push
