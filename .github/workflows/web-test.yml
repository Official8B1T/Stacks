# ─────────────────────────────────────────────────────
#   project · Stacks
#   module  · web-test.yml — proves the Web Stack audit can pass AND fail
#   author  · Jiří "8B1T" Lhotský
# ─────────────────────────────────────────────────────
# Every site's gate depends on web/audit, so a change to it must show
# each verdict on a known input before it reaches them via @main.
# NOTE · fixtures pin symfony/yaml 7.4.21 (PKSA-nktx-f1n1-b4yd) vs 7.4.23;
#        the advisory is permanent, so the expectations stay stable.

name: Web Stack tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: "8.4"
          coverage: none

      - name: Every verdict on a known input
        run: |
          t=web/audit/tests
          fail=0

          expect() {
            want=$1; shift
            php web/audit/audit.php "$@" > out.txt && got=0 || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "FAIL  audit $* → $got, expected $want"; cat out.txt; fail=1
            else
              echo "ok    audit $* → $got"
            fi
          }

          expect 0 $t/clean
          expect 1 $t/vulnerable
          expect 0 $t/ignored                      # composer audit.ignore is honoured
          expect 1 $t/vulnerable $t/clean          # change adds an advisory → block
          expect 0 $t/vulnerable $t/vulnerable     # already in base → warn, do not block
          expect 0 $t/clean $t/vulnerable          # change fixes it
          expect 0 $t/vulnerable $t/ignored        # dropping an ignore is not a new finding
          expect 0 $t/ignored $t/clean             # adding an ignore hides it, nothing new
          expect 2 $t/does-not-exist               # audit cannot run → fail closed

          exit $fail

      # fix.php rewrites composer.lock, so each case runs on a copy.
      - name: Nightly fix tells fixable from unfixable
        run: |
          t=web/audit/tests
          fail=0

          plan() {
            work=$(mktemp -d); cp "$t/$1"/composer.* "$work/"
            php web/audit/fix.php "$work" > out.txt 2>&1 && code=0 || code=$?
            got=$(grep -oE '^(FIXED|UNFIXABLE) [^ ]+' out.txt | tr '\n' ' ' | sed 's/ $//')
            if [ "$code" -ne 0 ] || [ "$got" != "$2" ]; then
              echo "FAIL  fix $1 → exit $code, [$got], expected [$2]"; cat out.txt; fail=1
            else
              echo "ok    fix $1 → [$got]"
            fi
          }

          plan clean ""
          plan fixable "FIXED PKSA-nktx-f1n1-b4yd"           # constraint allows 7.4.23
          plan vulnerable "UNFIXABLE PKSA-nktx-f1n1-b4yd"    # root pins 7.4.21, nothing may move it
          plan parent "FIXED PKSA-nktx-f1n1-b4yd"            # Kirby 5.6.2 pins 7.4.21, Kirby 5.6.3 brings 7.4.23

          exit $fail

      # Same state file across runs: first failure only counts, the second
      # alerts, a healthy check after an alert recovers.
      - name: Monitor alerts on the second failure, not the first
        run: |
          m="php web/monitor/monitor.php web/monitor/tests/weby.json state.json"
          fail=0
          rm -f state.json

          verdicts() { grep -oE '^(OK|FAIL|ALERT|RECOVER) [^ ]+' out.txt | tr '\n' ' ' | sed 's/ $//'; }
          step() {
            $m > out.txt 2>&1 && code=0 || code=$?
            got=$(verdicts)
            if [ "$code" -ne 0 ] || [ "$got" != "$1" ]; then
              echo "FAIL  run $2 → exit $code, [$got], expected [$1]"; cat out.txt; fail=1
            else
              echo "ok    run $2 → [$got]"
            fi
          }

          step "OK healthy FAIL no-dns FAIL refused" 1
          grep -q "DNS: stacks-monitor-test.invalid" out.txt || { echo "FAIL  DNS reason missing"; fail=1; }
          grep -q "nepřijímá spojení" out.txt || { echo "FAIL  refused reason missing"; fail=1; }
          step "OK healthy ALERT no-dns ALERT refused" 2

          # the broken sites come back: point them at the healthy URL
          sed -i 's#https://stacks-monitor-test.invalid/#https://example.com/#; s#https://127.0.0.1:9/#https://example.com/#' web/monitor/tests/weby.json
          step "OK healthy RECOVER no-dns RECOVER refused" 3
          step "OK healthy OK no-dns OK refused" 4

          exit $fail

      # A fake site answers /zdravi-<case> like site/plugins/zdravi in each
      # state; only the healthy one may pass, a wrong token must fail and a
      # missing token must stop the monitor instead of passing silently.
      - name: Health check tells every server state apart
        run: |
          php -S 127.0.0.1:8902 web/monitor/tests/zdravi.php > /dev/null 2>&1 &
          curl -sSf -o /dev/null --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8902/
          m="php web/monitor/monitor.php web/monitor/tests/zdravi.json st.json"
          verdicts() { grep -oE '^(OK|FAIL|ALERT|RECOVER) [^ ]+' out.txt | tr '\n' ' ' | sed 's/ $//'; }
          fail=0

          rm -f st.json; ZDRAVI_TOKEN=test-token $m > out.txt 2>&1 || { echo "FAIL  monitor exited"; cat out.txt; fail=1; }
          want="OK zdravy FAIL stary-tep FAIL chyba FAIL rozjeta FAIL bez-tepu FAIL plny-disk FAIL bez-pluginu"
          [ "$(verdicts)" = "$want" ] && echo "ok    every state → [$want]" || { echo "FAIL  got [$(verdicts)]"; cat out.txt; fail=1; }
          for reason in "cron v /etc/cron.d neběží" "skončil kódem 1" "nestojí na ověřené větvi" "nezapsal tep" "zbývá 4.2 %" "vrací 404"; do
            grep -q "$reason" out.txt || { echo "FAIL  reason missing: $reason"; fail=1; }
          done

          rm -f st.json; ZDRAVI_TOKEN=wrong $m > out.txt 2>&1
          grep -q "^FAIL zdravy" out.txt && echo "ok    wrong token fails" || { echo "FAIL  wrong token passed"; fail=1; }

          if ZDRAVI_TOKEN= $m > out.txt 2>&1; then echo "FAIL  missing token passed"; fail=1; else echo "ok    missing token stops the monitor"; fi

          exit $fail

  # web/a11y gates every site's pages; it must pass a clean page, fail a
  # broken one on the named rules, stay quiet in report mode and refuse an
  # empty URL list (an empty list would pass pages it never opened).
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Accessibility check passes AND fails
        run: |
          npm ci --prefix web/a11y --no-audit --no-fund --ignore-scripts
          (cd web/a11y/tests && python3 -m http.server 8901 > /dev/null 2>&1 &)
          curl -sSf -o /dev/null --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8901/ok.html
          echo /ok.html > ok.txt; echo /bad.html > bad.txt; : > empty.txt
          check="node web/a11y/a11y.mjs http://127.0.0.1:8901"
          fail=0

          $check ok.txt gate || { echo "FAIL  clean page did not pass"; fail=1; }
          if $check bad.txt gate > bad.out; then echo "FAIL  broken page passed the gate"; fail=1; fi
          if grep -q "image-alt" bad.out && grep -q "link-name" bad.out; then
            echo "ok    broken page failed on image-alt and link-name"
          else
            echo "FAIL  expected rules missing"; cat bad.out; fail=1
          fi
          $check bad.txt report > /dev/null || { echo "FAIL  report mode blocked"; fail=1; }
          if $check empty.txt gate; then echo "FAIL  empty URL list passed"; fail=1; fi

          exit $fail
