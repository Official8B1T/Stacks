# ─────────────────────────────────────────────────────
#   project · Stacks
#   module  · web-test.yml — proves the Web Stack audit can pass AND fail
#   author  · Jiří "8B1T" Lhotský
# ─────────────────────────────────────────────────────
# Every site's gate depends on web/audit, so a change to it must show
# each verdict on a known input before it reaches them via @main.
# NOTE · fixtures pin symfony/yaml 7.4.21 (PKSA-nktx-f1n1-b4yd) vs 7.4.23;
#        the advisory is permanent, so the expectations stay stable.

name: Web Stack tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Every verdict on a known input
        run: |
          t=web/audit/tests
          fail=0

          expect() {
            want=$1; shift
            php web/audit/audit.php "$@" > out.txt && got=0 || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "FAIL  audit $* → $got, expected $want"; cat out.txt; fail=1
            else
              echo "ok    audit $* → $got"
            fi
          }

          expect 0 $t/clean
          expect 1 $t/vulnerable
          expect 0 $t/ignored                      # composer audit.ignore is honoured
          expect 1 $t/vulnerable $t/clean          # change adds an advisory → block
          expect 0 $t/vulnerable $t/vulnerable     # already in base → warn, do not block
          expect 0 $t/clean $t/vulnerable          # change fixes it
          expect 0 $t/vulnerable $t/ignored        # dropping an ignore is not a new finding
          expect 0 $t/ignored $t/clean             # adding an ignore hides it, nothing new
          expect 2 $t/does-not-exist               # audit cannot run → fail closed

          exit $fail

      # fix.php rewrites composer.lock, so each case runs on a copy.
      - name: Nightly fix tells fixable from unfixable
        run: |
          t=web/audit/tests
          fail=0

          plan() {
            work=$(mktemp -d); cp "$t/$1"/composer.* "$work/"
            php web/audit/fix.php "$work" > out.txt 2>&1 && code=0 || code=$?
            got=$(grep -oE '^(FIXED|UNFIXABLE) [^ ]+' out.txt | tr '\n' ' ' | sed 's/ $//')
            if [ "$code" -ne 0 ] || [ "$got" != "$2" ]; then
              echo "FAIL  fix $1 → exit $code, [$got], expected [$2]"; cat out.txt; fail=1
            else
              echo "ok    fix $1 → [$got]"
            fi
          }

          plan clean ""
          plan fixable "FIXED PKSA-nktx-f1n1-b4yd"           # constraint allows 7.4.23
          plan vulnerable "UNFIXABLE PKSA-nktx-f1n1-b4yd"    # root pins 7.4.21, nothing may move it
          plan parent "FIXED PKSA-nktx-f1n1-b4yd"            # Kirby 5.6.2 pins 7.4.21, Kirby 5.6.3 brings 7.4.23

          exit $fail

      # Same state file across runs: first failure only counts, the second
      # alerts, a healthy check after an alert recovers.
      - name: Monitor alerts on the second failure, not the first
        run: |
          m="php web/monitor/monitor.php web/monitor/tests/weby.json state.json"
          fail=0
          rm -f state.json

          verdicts() { grep -oE '^(OK|FAIL|ALERT|RECOVER) [^ ]+' out.txt | tr '\n' ' ' | sed 's/ $//'; }
          step() {
            $m > out.txt 2>&1 && code=0 || code=$?
            got=$(verdicts)
            if [ "$code" -ne 0 ] || [ "$got" != "$1" ]; then
              echo "FAIL  run $2 → exit $code, [$got], expected [$1]"; cat out.txt; fail=1
            else
              echo "ok    run $2 → [$got]"
            fi
          }

          step "OK healthy FAIL no-dns FAIL refused" 1
          grep -q "DNS: stacks-monitor-test.invalid" out.txt || { echo "FAIL  DNS reason missing"; fail=1; }
          grep -q "nepřijímá spojení" out.txt || { echo "FAIL  refused reason missing"; fail=1; }
          step "OK healthy ALERT no-dns ALERT refused" 2

          # the broken sites come back: point them at the healthy URL
          sed -i 's#https://stacks-monitor-test.invalid/#https://example.com/#; s#https://127.0.0.1:9/#https://example.com/#' web/monitor/tests/weby.json
          step "OK healthy RECOVER no-dns RECOVER refused" 3
          step "OK healthy OK no-dns OK refused" 4

          exit $fail
